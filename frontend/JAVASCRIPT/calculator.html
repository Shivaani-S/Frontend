<body>
<h1>Calculator</h1>
<input type="number" placeholder="Enter num1" id="num1">
<input type="number" placeholder="Enter num2" id="num2">
<h1 id="result"> Ans:</h1>
<div>
<button onclick="calc(event)">Add</button>
<button onclick="calc(event)">Sub</button>
<button onclick="calc(event)">Mul</button>
<button onclick="calc(event)">Divide</button>
</div>

</body>

<style>
    *{
        margin: 20px;
        padding: 20px;
    }
    body{
        background-color: black;
        color: white;
        position: absolute;
        left: 50px;
    }
</style>

<script>
    let ans=document.getElementById("result")
    

    function calc(event)
    {
        let num1=+document.getElementById("num1").value
        let num2=+document.getElementById("num2").value
        
        if(event.target.textContent=="Add")
            ans.textContent= num1+num2

        else if(event.target.textContent =="Sub")
           ans.textContent=num1-num2

        else if(event.target.textContent =="Mul")
           ans.textContent=num1*num2

        else if(event.target.textContent =="Divide")
           ans.textContent=num1/num2
         

    }
</script>
